[build-system]
requires = [ "hatchling", "hatch-vcs",]
build-backend = "hatchling.build"

[project]
name = "aleph-scoring"
dynamic = ["version"]
description = "Aleph Scoring Project"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "aleph-message==0.4.9",
    "aleph-sdk-python==1.0.1",
    "asyncpg==0.29.0",
    "cachetools",
    "icmplib==3.0.4",
    # "bokeh==3.5.2",
    # "jupyterlab==4.2.5",
    # "matplotlib==3.9.2",
    # "nbconvert==7.16.4",
    ## "pandas==2.2.2",
    # "pandoc==2.4",
    "setuptools",
    "pyasn==1.6.2",
    "typer",
    "schedule",
    "sentry-sdk",
    "psutil",
    # "tables==3.10.1",
    # "holoviews==1.19.1",
]

[project.optional-dependencies]
dev = [
    "black==23.1.0",
    "pytest==7.2.1",
    "mypy==1.0.1",
    "pytest-asyncio==0.20.3",
    "isort==5.12.0",
]

[project.urls]
Documentation = "https://docs.aleph.im/"
Issues = "https://github.com/aleph-im/aleph-scoring/issues"
Source = "https://github.com/aleph-im/aleph-scoring"
Discussions = "https://community.aleph.im/"

[project.scripts]
scoring = "aleph_scoring.__main__:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["aleph_scoring"]

[tool.hatch.metadata]
allow-direct-references = false

[tool.hatch.envs.default.scripts]
measure = "python -m aleph_scoring measure"

[tool.hatch.envs.linting]
detached = true
dependencies = [
    "black==24.2.0",
    "mypy==1.9.0",
    "mypy-extensions==1.0.0",
    "ruff==0.4.8",
    "isort==5.13.2",
]
[tool.hatch.envs.linting.scripts]
style = [
    "ruff check {args:.} ./aleph_scoring/ ./tests/",
    "black --check --diff {args:} ./aleph_scoring/ ./tests/",
    "isort --check-only --profile black {args:} ./aleph_scoring/ ./tests/",
]
fmt = [
    "black {args:} ./aleph_scoring/ ./tests/",
    "ruff check --fix {args:.} ./aleph_scoring/ ./tests/",
    "isort --profile black {args:} ./aleph_scoring/ ./tests/",
    "style",
]
all = [
    "style",
]

[tool.hatch.envs.typing]
dependencies = [
    "mypy==1.11.2",
    "mypy-extensions==1.0.0",
    "types-cachetools~=5.5.0.20240820",
    "types-requests~=2.32.0.20240914",
    "pytest==8.3.3",
]
[tool.hatch.envs.typing.scripts]
typing = "mypy --config-file=pyproject.toml {args:} ./aleph_scoring/"
all = [
    "typing"
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
install_types = true
non_interactive = true
ignore_missing_imports = true
explicit_package_bases = true
