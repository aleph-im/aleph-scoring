[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "aleph-scoring"
dynamic = ["version"]
description = "Metrics and scores for Aleph.im nodes"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Aleph.im Team", email = "hello@aleph.im" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "aleph-message==0.4.7",
    "aleph-sdk-python==0.9.0",
    "asyncpg==0.29.0",
    "cachetools==5.3.3",
    "holoviews==1.19.0",
    "icmplib==3.0.4",
    "pandas==2.2.2",
    "pyasn==1.6.2",
    "schedule==1.2.2",
    "sentry-sdk==2.7.1",
    "tables==3.9.2",
]

[project.optional-dependencies]
all = [
    "bokeh==3.4.2",
    "jupyterlab==4.2.3",
    "matplotlib==3.9.0",
    "nbconvert[qtpdf]",
    "pandoc",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://docs.aleph.im/"
Homepage = "https://github.com/aleph-im/aleph-scoring"

[tool.hatch.version]
source = "vcs"

[tool.isort]
profile = "black"

[[tool.hatch.envs.all.matrix]]
python = ["3.11"]

[tool.hatch.envs.testing]
dependencies = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
]
[tool.hatch.envs.testing.scripts]
test = "pytest {args:} ./src/ ./tests/"
test-cov = "pytest --cov {args:} ./src/ ./tests/"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[tool.hatch.envs.linting]
detached = true
dependencies = [
    "black==24.4.2",
    "mypy==1.10.1",
    "isort==5.13.2",
]
[tool.hatch.envs.linting.scripts]
typing = "mypy --config-file=pyproject.toml {args:} ./src/ ./tests/"
style = [
    "ruff check {args:.} ./src/ ./tests/",
    "black --check --diff {args:} ./src/ ./tests/",
    "isort --check-only --profile black {args:} ./src/ ./tests/",
]
fmt = [
    "black {args:} ./src/ ./tests/",
    "ruff check {args:.} ./src/ ./tests/",
    "isort --profile black {args:} ./src/ ./tests/",
    "style",
]
all = [
    "style",
    "typing",
]

[tool.mypy]
python_version = 3.11
mypy_path = "src"
show_column_numbers = true
check_untyped_defs = true

# Import discovery
# Install types for third-party library stubs (e.g. from typeshed repository)
install_types = true
non_interactive = true
# Suppresses error messages about imports that cannot be resolved (no py.typed file, no stub file, etc).
ignore_missing_imports = true
# Don't follow imports
follow_imports = "silent"

# Miscellaneous strictness flags
# Allows variables to be redefined with an arbitrary type, as long as the redefinition is in the same block and nesting level as the original definition.
allow_redefinition = true

[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = ["src"]
addopts = "-vv"
norecursedirs = ["*.egg", "dist", "build", ".tox", ".venv", "*/site-packages/*"]
testpaths = ["tests/unit"]

[tool.coverage.run]
branch = true
parallel = true
source = [
    "src/",
]
omit = [
    "*/site-packages/*",
]

[tool.coverage.paths]
source = [
    "src/",
]
omit = [
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about ineffective code:
    "pass",
]
